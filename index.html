<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semana 1 P2 · Traducción verbal ↔ algebraico · I.E. Merceditas Gómez Martínez</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="document.dispatchEvent(new Event('katex-ready'))"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F2040;--blue:#1C3A6E;--blue-mid:#2E75B6;
  --teal:#1A6B5A;--amber:#C47C1A;--red:#B83232;--purple:#6C3483;
  --green-week:#2E7D32;--green-soft:#E8F5E9;
  --cream:#F4F3EF;--warm:#EDECEA;--border:#D8D5CC;
  --text:#1C1C1E;--text2:#3A3A3C;--text3:#6B6B6E;
  --green-s:#27AE60;--amber-s:#E08C20;--red-s:#C0392B;
}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:'DM Sans',system-ui,sans-serif}

/* DECK */
#deck{width:100vw;height:100vh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;background:var(--cream)}
.slide.active{opacity:1;pointer-events:all}
.slide.enter-r{animation:inR .4s cubic-bezier(.22,.68,0,1.15) forwards}
.slide.enter-l{animation:inL .4s cubic-bezier(.22,.68,0,1.15) forwards}
@keyframes inR{from{transform:translateX(5%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-5%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* HEADER */
.hdr{background:var(--navy);height:50px;display:flex;align-items:center;padding:0 30px;justify-content:space-between;flex-shrink:0}
.hdr-b{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#A8C4E8}
.hdr-t{background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:4px 14px;border-radius:4px;letter-spacing:.07em;text-transform:uppercase}

/* FOOTER */
.ftr{background:var(--warm);border-top:1px solid var(--border);height:36px;display:flex;align-items:center;padding:0 30px;justify-content:space-between;flex-shrink:0}
.ftr span{font-size:12px;color:var(--text3)}

/* BODY */
.body{flex:1;overflow:hidden;padding:26px 38px 18px;display:flex;flex-direction:column;gap:16px}

/* TYPOGRAPHY */
.slide-title{font-family:'DM Serif Display',serif;font-size:clamp(28px,3.5vw,42px);color:var(--text);line-height:1.15}
.slide-instr{font-size:clamp(16px,1.8vw,20px);color:var(--text2);font-style:italic;margin-top:5px}
.title-row{display:flex;align-items:flex-start;gap:14px}
.accent{width:8px;border-radius:4px;flex-shrink:0;margin-top:5px}

/* KATEX */
.katex{font-size:1em!important}
.katex-display{font-size:1.1em!important;margin:0!important}
.fml-big .katex{font-size:2.4em!important;color:var(--text)!important}
.fml-mid .katex{font-size:1.7em!important;color:var(--text)!important}
.fml-dark .katex{color:#fff!important}

/* ── PORTADA SEMANA ── */
.s-portada{background:var(--navy);align-items:center;justify-content:center}
.p-inner{display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center;padding:40px;width:100%}
.p-badge{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#A8C4E8;font-weight:600}
.p-title{font-family:'DM Serif Display',serif;font-size:clamp(56px,8vw,96px);color:#fff;line-height:1;animation:fadeUp .8s .1s both}
.p-title em{color:var(--amber);font-style:normal}
.p-sub{font-size:clamp(20px,2.3vw,28px);color:#A8C4E8;animation:fadeUp .8s .3s both}
.hilo-box{background:rgba(46,125,50,.15);border:1.5px solid rgba(46,125,50,.6);border-radius:14px;padding:22px 30px;max-width:900px;animation:fadeUp .8s .4s both}
.hilo-lbl{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#7FCB85;font-weight:700;margin-bottom:8px}
.hilo-q{font-family:'DM Serif Display',serif;font-size:clamp(20px,2.4vw,28px);color:#fff;font-style:italic;line-height:1.4}
.p-sessions{display:flex;gap:24px;margin-top:8px;animation:fadeUp .8s .5s both;width:100%;justify-content:center;flex-wrap:wrap}
.psess{background:rgba(255,255,255,.07);border:1px solid rgba(168,196,232,.2);border-radius:16px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;max-width:300px;min-width:240px}
.psess-n{width:46px;height:46px;border-radius:50%;background:var(--green-week);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:19px}
.psess-t{font-size:17px;font-weight:600;color:#fff;text-align:center}
.psess-s{font-size:14px;color:#A8C4E8;font-style:italic;text-align:center}

/* ── PORTADA SESIÓN ── */
.s-sesion{background:var(--cream)}
.s-sesion .body{flex-direction:row;padding:0;gap:0}
.pan{width:220px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.pan::after{content:'';position:absolute;bottom:34%;left:25%;right:25%;height:3px;background:var(--green-week);border-radius:2px}
.pan-n{font-family:'DM Serif Display',serif;font-size:140px;line-height:1;color:#fff}
.pan-l{font-size:18px;font-weight:700;letter-spacing:.2em;color:#A8C4E8;text-transform:uppercase}
.sess-content{flex:1;padding:38px 44px;display:flex;flex-direction:column;gap:18px;overflow:hidden;justify-content:center}
.sess-eyebrow{font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--green-week)}
.sess-title{font-family:'DM Serif Display',serif;font-size:clamp(32px,4.2vw,52px);color:var(--text);line-height:1.1}
.sess-desc{font-size:clamp(16px,1.8vw,21px);color:var(--text2);line-height:1.55;max-width:780px}
.sess-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.sess-chip{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 18px;font-size:clamp(14px,1.5vw,17px);color:var(--text);display:flex;align-items:center;gap:10px}
.sess-chip strong{color:var(--green-week)}

/* ── DETONANTE ── */
.det-box{background:#FFF8F0;border:2.5px solid var(--amber);border-radius:14px;padding:24px 30px;flex:1;display:flex;flex-direction:column;gap:14px}
.det-label{font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--amber)}
.det-text{font-family:'DM Serif Display',serif;font-size:clamp(19px,2.1vw,26px);color:var(--text);line-height:1.55;font-style:italic}
.det-text strong{font-style:normal;color:var(--amber)}
.det-q-box{background:var(--green-soft);border:2px solid var(--green-week);border-radius:12px;padding:18px 24px;margin-top:auto}
.det-q-lbl{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-week);margin-bottom:8px}
.det-q-txt{font-family:'DM Serif Display',serif;font-size:clamp(18px,2vw,24px);color:var(--text);font-style:italic;line-height:1.45}

/* ── YO HAGO — pasos animados ── */
.s-yo{background:var(--navy)}
.s-yo .hdr{background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.1)}
.s-yo .ftr{background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.1)}
.s-yo .ftr span{color:#555}
.s-yo .slide-title{color:#fff}
.s-yo .slide-instr{color:#A8C4E8}
.yo-steps{display:flex;flex-direction:column;gap:10px;flex:1}
.yo-step{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 18px;display:grid;grid-template-columns:50px 1fr 1.2fr;gap:18px;align-items:center;opacity:0;transform:translateX(20px);transition:opacity .5s,transform .5s}
.yo-step.vis{opacity:1;transform:none}
.yo-step-n{width:42px;height:42px;border-radius:50%;background:var(--green-week);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.yo-step-mid{display:flex;flex-direction:column;gap:5px}
.yo-step-lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7FCB85}
.yo-step-desc{font-size:clamp(14px,1.55vw,17px);color:#fff;line-height:1.4}
.yo-step-fml{background:rgba(255,255,255,.08);border:1px solid rgba(168,196,232,.25);border-radius:10px;padding:14px;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(15px,1.6vw,18px)}
.yo-step-fml .katex{color:#fff!important;font-size:1.6em!important}

/* ── HACEMOS / TÚ HACES — CONSIGNAS ── */
.cons-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1}
.cons-card{background:#fff;border-radius:12px;border:1px solid var(--border);border-left:7px solid var(--blue-mid);padding:20px;display:flex;flex-direction:column;gap:12px}
.cons-head{display:flex;align-items:center;gap:13px}
.cons-n{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff}
.cons-title{font-size:clamp(19px,2vw,23px);font-weight:700;color:var(--text)}
.cons-pista{font-size:clamp(18px,1.9vw,22px);color:var(--text2);font-style:italic;line-height:1.5;flex:1}
.cons-task{background:var(--warm);border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:center;font-size:clamp(15px,1.65vw,19px);font-weight:600;color:var(--blue-mid);letter-spacing:.04em}

/* ── SOCIALIZACIÓN ── */
.soc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}
.soc-card{background:#fff;border-radius:12px;border:1px solid var(--border);border-left:7px solid var(--blue-mid);padding:18px;display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s}
.soc-card.vis{opacity:1;transform:none}
.soc-head{display:flex;align-items:center;gap:12px}
.soc-n{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.soc-title{font-size:clamp(15px,1.65vw,19px);font-weight:700;color:var(--text)}
.soc-pista{font-size:clamp(13px,1.45vw,16px);color:var(--text2);font-style:italic;line-height:1.4}
.soc-fml{background:var(--warm);border:1.5px solid var(--blue-mid);border-radius:10px;padding:12px;text-align:center;display:flex;align-items:center;justify-content:center;min-height:60px}
.soc-fml .katex{font-size:1.85em!important}

/* ── TRANSICIÓN ── */
.s-trans{background:var(--blue);align-items:center;justify-content:center}
.trans-big{font-family:'DM Serif Display',serif;font-size:clamp(60px,10vw,110px);color:#fff;line-height:1;animation:fadeUp .6s both}
.trans-sub{font-size:clamp(19px,2.1vw,24px);color:#A8C4E8;animation:fadeUp .6s .2s both}
.trans-note{font-size:clamp(15px,1.6vw,18px);color:rgba(168,196,232,.6);font-style:italic;animation:fadeUp .6s .4s both}

/* ── ACTIVIDAD INTERACTIVA — TRADUCTOR ── */
.tr-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;align-items:start}
.tr-panel{background:#fff;border-radius:14px;border:2px solid var(--blue-mid);padding:22px;display:flex;flex-direction:column;gap:14px}
.tr-panel-t{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-mid)}
.tr-prompt{background:#FFF8F0;border:1.5px solid var(--amber);border-radius:10px;padding:14px 18px;font-family:'DM Serif Display',serif;font-size:clamp(17px,1.85vw,22px);color:var(--text);font-style:italic;line-height:1.45;min-height:62px;display:flex;align-items:center}
.tr-options{display:flex;flex-direction:column;gap:10px}
.tr-opt{background:#fff;border:2px solid var(--border);border-radius:11px;padding:13px 18px;font-size:clamp(15px,1.7vw,19px);font-family:inherit;color:var(--text);cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:14px}
.tr-opt:hover{border-color:var(--blue-mid);background:#EBF4FB}
.tr-opt.correct{border-color:var(--green-week);background:var(--green-soft);color:var(--green-week);font-weight:600}
.tr-opt.wrong{border-color:var(--red);background:#FFEBEE;color:var(--red)}
.tr-opt.disabled{cursor:default;opacity:.6}
.tr-opt-mark{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.tr-opt.correct .tr-opt-mark{background:var(--green-week);border-color:var(--green-week);color:#fff}
.tr-opt.wrong .tr-opt-mark{background:var(--red);border-color:var(--red);color:#fff}
.tr-opt-fml{flex:1}
.tr-progress{display:flex;gap:6px;justify-content:center;margin-top:6px}
.tr-pdot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:background .3s}
.tr-pdot.done{background:var(--green-week)}
.tr-pdot.cur{background:var(--blue-mid);box-shadow:0 0 0 4px rgba(46,117,182,.2)}
.tr-feedback{background:var(--green-soft);border:2px solid var(--green-week);border-radius:11px;padding:14px 18px;font-size:clamp(15px,1.65vw,19px);color:var(--text);line-height:1.5;display:none}
.tr-feedback.show{display:block;animation:fadeUp .4s both}
.tr-feedback strong{color:var(--green-week)}
.tr-feedback.err{background:#FFEBEE;border-color:var(--red)}
.tr-feedback.err strong{color:var(--red)}
.tr-next-btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px;font-size:clamp(14px,1.5vw,17px);font-family:inherit;cursor:pointer;font-weight:600;transition:background .2s;margin-top:8px}
.tr-next-btn:hover{background:var(--blue-mid)}
.tr-next-btn:disabled{background:var(--border);cursor:not-allowed;color:var(--text3)}
.tr-score{background:var(--navy);color:#fff;border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.tr-score-n{font-family:'DM Serif Display',serif;font-size:clamp(48px,7vw,84px);line-height:1;color:#fff}
.tr-score-n em{color:var(--amber);font-style:normal;font-size:.55em}
.tr-score-t{font-size:clamp(15px,1.7vw,19px);color:#A8C4E8}
.tr-stars{display:flex;gap:8px;font-size:clamp(28px,3.5vw,40px)}
.tr-stars span{filter:grayscale(1);opacity:.3;transition:filter .3s,opacity .3s}
.tr-stars span.lit{filter:none;opacity:1}
.tr-restart{background:var(--blue-mid);color:#fff;border:none;border-radius:10px;padding:11px 22px;font-size:clamp(14px,1.5vw,17px);font-family:inherit;cursor:pointer;font-weight:600;margin-top:6px}
.tr-restart:hover{background:var(--blue)}

/* ── RÚBRICA ── */
.rub-table{width:100%;border-collapse:collapse;font-size:clamp(14px,1.5vw,17px)}
.rub-table th{background:var(--navy);color:#fff;padding:12px 14px;text-align:left;font-size:clamp(13px,1.4vw,16px);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.rub-table td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.45;color:var(--text);font-size:clamp(13px,1.45vw,16px)}
.rub-table tr:nth-child(even) td{background:var(--warm)}
.rub-table tr:nth-child(odd) td{background:#fff}
.rub-table td:first-child{font-weight:700;color:var(--blue);background:#EBF4FB!important;border-right:2px solid var(--blue-mid);font-size:clamp(14px,1.5vw,17px)}
.rub-table tbody tr{opacity:0;transform:translateX(-10px);transition:opacity .4s,transform .4s}
.rub-table tbody tr.vis{opacity:1;transform:none}

/* ── METACOGNICIÓN ── */
.meta-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;flex:1}
.meta-l{display:flex;flex-direction:column;gap:16px}
.meta-qbox{background:#E0F2F1;border:2.5px solid var(--teal);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;gap:10px}
.meta-qlbl{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.meta-qtxt{font-family:'DM Serif Display',serif;font-size:clamp(17px,2vw,23px);color:var(--text);font-style:italic;line-height:1.55}
.meta-cuad-t{font-size:clamp(15px,1.65vw,19px);font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.1em}
.meta-cuad{display:flex;flex-direction:column;gap:10px}
.meta-cuad-i{display:flex;align-items:flex-start;gap:14px;background:#fff;border-radius:10px;padding:13px 18px;border-left:4px solid var(--teal);font-size:clamp(15px,1.65vw,19px);color:var(--text);line-height:1.45}
.meta-cuad-n{font-weight:700;color:var(--teal);flex-shrink:0;min-width:24px}
.meta-r{display:flex;flex-direction:column;gap:14px}
.meta-sema-t{font-size:clamp(15px,1.65vw,19px);font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.1em}
.meta-sema{display:flex;flex-direction:column;gap:12px}
.meta-sema-i{display:flex;align-items:center;gap:16px;background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 2px 8px rgba(0,0,0,.07);opacity:0;transform:translateX(16px);transition:opacity .5s,transform .5s}
.meta-sema-i.vis{opacity:1;transform:none}
.meta-sema-c{width:42px;height:42px;border-radius:50%;flex-shrink:0}
.meta-sema-tx{font-size:clamp(15px,1.65vw,19px);color:var(--text);line-height:1.3}
.meta-sema-tx strong{display:block;font-size:clamp(13px,1.4vw,15px);color:var(--text3);margin-top:2px;font-weight:500}
.next-step{background:var(--green-soft);border:2px solid var(--green-week);border-radius:11px;padding:14px 18px;font-size:clamp(14px,1.5vw,17px);color:var(--text);line-height:1.5}
.next-step-l{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green-week);margin-bottom:6px}

/* NAV */
#nav{position:fixed;bottom:20px;right:28px;display:flex;align-items:center;gap:12px;z-index:100}
.nbtn{width:44px;height:44px;border-radius:50%;background:rgba(15,32,64,.85);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.nbtn:hover{background:var(--blue)}
#ncnt{font-size:13px;color:rgba(255,255,255,.8);background:rgba(15,32,64,.7);padding:5px 13px;border-radius:20px;font-family:monospace}
#pbar{position:fixed;bottom:0;left:0;height:4px;background:var(--green-week);transition:width .35s ease;z-index:100}
#hint{position:fixed;bottom:20px;left:28px;font-size:12px;color:rgba(255,255,255,.45);background:rgba(15,32,64,.6);padding:5px 13px;border-radius:20px;font-family:monospace;transition:opacity .3s}
.sol-btn{background:#fff;border:2px solid currentColor;border-radius:8px;padding:8px 18px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.03em;transition:background .25s,opacity .25s;align-self:flex-start;margin-top:4px}
.sol-btn:hover{background:var(--warm)}
.sol-btn.shown{opacity:.55}
</style>
</head>
<body>
<div id="deck"></div>
<div id="nav">
  <button class="nbtn" id="bp">&#8592;</button>
  <span id="ncnt">1 / N</span>
  <button class="nbtn" id="bn">&#8594;</button>
</div>
<div id="pbar"></div>
<div id="hint">Espacio / → avanzar &nbsp;|&nbsp; ← retroceder</div>

<script>
/* ============================================================
   ACTIVIDAD INTERACTIVA — TRADUCTOR ALGEBRAICO
   ============================================================ */
const TRADUCTOR_PREGUNTAS = [
  {
    enunciado: 'El triple de un número, disminuido en cuatro',
    correcta: 0,
    opciones: [
      '3x - 4',
      '3(x - 4)',
      '\\dfrac{x}{3} - 4',
      'x^3 - 4'
    ],
    explicacion: '"El triple de un número" es \\(3x\\). "Disminuido en cuatro" significa restar 4: \\(3x - 4\\). Si fuera \\(3(x-4)\\) la frase diría "el triple de un número disminuido en cuatro" sin la coma — la coma cambia el significado.'
  },
  {

let trIdx = 0, trAciertos = 0, trAnswered = false;

function renderTraductor(){
  const c = document.getElementById('tr-card');
  const f = document.getElementById('tr-fb');
  const dots = document.getElementById('tr-dots');
  const next = document.getElementById('tr-next');
  if(!c) return;

  if(trIdx >= TRADUCTOR_PREGUNTAS.length){
    // Pantalla de resultado
    const stars = trAciertos >= 5 ? 3 : trAciertos >= 3 ? 2 : trAciertos >= 1 ? 1 : 0;
    c.innerHTML = `
      <div class="tr-score">
        <div class="tr-stars">
          ${[1,2,3].map(i=>`<span class="${i<=stars?'lit':''}">⭐</span>`).join('')}
        </div>
        <div class="tr-score-n">${trAciertos}<em>/5</em></div>
        <div class="tr-score-t">${trAciertos === 5 ? '¡Excelente! Dominas la traducción.' : trAciertos >= 3 ? 'Buen trabajo. Revisa los errores con tu compañero.' : 'Necesitas repasar. Vuelve a intentar las preguntas falladas.'}</div>
        <button class="tr-restart" onclick="trReiniciar()">↻ Volver a intentar</button>
      </div>`;
    if(f) f.classList.remove('show');
    if(dots) dots.style.display='none';
    if(next) next.style.display='none';
    doKatex(c);
    return;
  }

  const q = TRADUCTOR_PREGUNTAS[trIdx];
  trAnswered = false;

  c.innerHTML = `
    <div class="tr-panel-t">Pregunta ${trIdx+1} de ${TRADUCTOR_PREGUNTAS.length}</div>
    <div class="tr-prompt">"${q.enunciado}"</div>
    <div class="tr-options">
      ${q.opciones.map((op,i)=>`
        <button class="tr-opt" data-i="${i}" onclick="trResponder(${i})">
          <div class="tr-opt-mark">${String.fromCharCode(65+i)}</div>
          <div class="tr-opt-fml">\\(${op}\\)</div>
        </button>`).join('')}
    </div>`;

  if(f){ f.classList.remove('show','err'); f.innerHTML=''; }
  if(dots){
    dots.style.display='flex';
    dots.innerHTML = TRADUCTOR_PREGUNTAS.map((_,i)=>{
      const cls = i < trIdx ? 'done' : (i === trIdx ? 'cur' : '');
      return `<div class="tr-pdot ${cls}"></div>`;
    }).join('');
  }
  if(next){
    next.style.display='block';
    next.disabled = true;
    next.textContent = trIdx === TRADUCTOR_PREGUNTAS.length-1 ? 'Ver resultado →' : 'Siguiente pregunta →';
  }
  doKatex(c);
}

function trResponder(i){
  if(trAnswered) return;
  trAnswered = true;
  const q = TRADUCTOR_PREGUNTAS[trIdx];
  const f = document.getElementById('tr-fb');
  const next = document.getElementById('tr-next');
  const buttons = document.querySelectorAll('.tr-opt');

  buttons.forEach((b,idx)=>{
    b.classList.add('disabled');
    if(idx === q.correcta) b.classList.add('correct');
    else if(idx === i) b.classList.add('wrong');
  });

  if(i === q.correcta){
    trAciertos++;
    f.classList.remove('err');
    f.innerHTML = `<strong>✓ ¡Correcto!</strong><br>${q.explicacion}`;
  } else {
    f.classList.add('err');
    f.innerHTML = `<strong>✗ Inténtalo de nuevo</strong><br>${q.explicacion}`;
  }
  f.classList.add('show');
  if(next) next.disabled = false;
  doKatex(f);
}

function trAvanzar(){
  trIdx++;
  renderTraductor();
}

function trReiniciar(){
  trIdx = 0;
  trAciertos = 0;
  renderTraductor();
}

/* ============================================================
   ENGINE
   ============================================================ */
let cur = 0, clicks = 0;
const deck = document.getElementById('deck');

function buildSlide(idx){
  const s = SLIDES[idx];
  const d = document.createElement('div');
  d.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let h = '';
  if(!s.noH) h += `<div class="hdr"><span class="hdr-b">${s.bread||''}</span>${s.time?`<span class="hdr-t">${s.time}</span>`:''}</div>`;
  h += `<div class="body">${s.html}</div>`;
  if(!s.noF) h += `<div class="ftr"><span>${s.fL||''}</span><span>I.E. Merceditas Gómez Martínez · Grado 8°</span></div>`;
  d.innerHTML = h;
  return d;
}

function show(idx, dir){
  const prev = deck.querySelector('.slide.active');
  if(prev){
    prev.classList.remove('active','enter-r','enter-l');
    if(SLIDES[cur-dir] && SLIDES[cur-dir].onLeave) SLIDES[cur-dir].onLeave();
  }
  const el = buildSlide(idx);
  deck.appendChild(el);
  const all = deck.querySelectorAll('.slide');
  if(all.length > 3) all[0].remove();
  requestAnimationFrame(()=>{
    el.classList.add('active');
    el.classList.add(dir >= 0 ? 'enter-r' : 'enter-l');
    setTimeout(()=>el.classList.remove('enter-r','enter-l'), 420);
    doKatex(el);
    if(SLIDES[idx].onEnter) SLIDES[idx].onEnter();
  });
  clicks = 0;
  document.getElementById('ncnt').textContent = `${idx+1} / ${SLIDES.length}`;
  document.getElementById('pbar').style.width = (((idx+1)/SLIDES.length)*100)+'%';
}

function doKatex(el){
  if(window.renderMathInElement){
    renderMathInElement(el, {
      delimiters: [
        {left:'\\(', right:'\\)', display:false},
        {left:'\\[', right:'\\]', display:true},
        {left:'$$', right:'$$', display:true},
        {left:'$',  right:'$',  display:false},
      ],
      throwOnError: false
    });
  }
}

function advance(){
  const s = SLIDES[cur];
  if(clicks < (s.clicks||0)){
    clicks++;
    if(s.onReveal) s.onReveal(clicks);
    return;
  }
  if(cur < SLIDES.length-1){ cur++; show(cur, 1); }
}
function retreat(){ if(cur > 0){ cur--; show(cur, -1); } }

document.addEventListener('keydown', e=>{
  // No interceptar teclas si el foco está en un botón interactivo (traductor)
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag === 'button' && (e.code === 'Space' || e.code === 'Enter')){
    return; // dejar que el botón reciba el evento
  }
  if(e.code === 'Space' || e.code === 'ArrowRight'){ e.preventDefault(); advance(); }
  if(e.code === 'ArrowLeft'){ e.preventDefault(); retreat(); }
});
document.getElementById('bn').addEventListener('click', advance);
document.getElementById('bp').addEventListener('click', retreat);

let tx = 0;
document.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - tx;
  if(Math.abs(dx) > 50){ dx < 0 ? advance() : retreat(); }
});

setTimeout(()=>{ document.getElementById('hint').style.opacity = '0'; }, 4000);
document.addEventListener('katex-ready', ()=>{
  const a = deck.querySelector('.slide.active');
  if(a) doKatex(a);
});

function toggleSol(id, btn){
  const el = document.getElementById(id);
  if(!el) return;
  const show = el.style.display === 'none' || el.style.display === '';
  el.style.display = show ? 'flex' : 'none';
  btn.textContent = show ? 'Ocultar' : 'Ver solución';
  btn.classList.toggle('shown', show);
  if(show && window.katex) doKatex(el.closest('.slide') || el.parentElement);
}

show(0, 1);
</script>
</body>
</html>
